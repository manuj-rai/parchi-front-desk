# The kinds of health problem a caller may mention. Shared by every clinic.
#
# Each clinic file lists the areas its doctor treats. For any other area, Parchi gives no
# token and no hope: it says, in `see`, which kind of doctor to go to instead.
#
#   label      what the front-desk agent must copy back exactly (it chooses from these)
#   describes  helps the agent match what callers actually say
#   spoken     how Parchi names the problem out loud
#   see        who Parchi tells the caller to see, out loud
#   words      used ONLY by the stand-in models in offline test mode, never by the real agents

[fever-cough-cold]
label = "fever, cough and cold"
describes = "fever, cough, cold, flu, sore body with fever, viral infection"
spoken = "bukhar, khansi ya zukaam"
see = "kisi general physician"
words = ["bukhar", "fever", "khansi", "cough", "zukaam", "jukam", "बुखार", "खांसी", "ज़ुकाम", "बुख़ार"]

